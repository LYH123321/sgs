# SGS (三国杀) — LÖVE for Android shell
#
# This project wraps the upstream LÖVE Android runtime and embeds the SGS game
# as app/src/embed/assets/game.love.

# App name shown in the launcher.
app.name=SGS

# Unique application id.
app.application_id=com.sgs.game

# The game is designed for 1130x650 landscape; force landscape so the
# existing scale.lua constants apply unchanged.
app.orientation=landscape

app.version_code=1
app.version_name=1.0.0

# No need to modify anything past this line!
android.enableJetifier=false
android.useAndroidX=true
android.nonTransitiveRClass=true
android.nonFinalResIds=true
android.dependency.useConstraints=true
