name: Build Android APK

on:
  push:
    branches: [ android ]
  pull_request:
    branches: [ android ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      GRADLE_OPTS: "-Dorg.gradle.jvmargs=-Xmx4G"

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      # The upstream LÖVE Android shell keeps its native sources in two
      # submodules (~420 MB). They are git-ignored in this repo, so fetch them
      # at the exact commits this shell was taken from.
      - name: Fetch LÖVE native sources
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/love2d/love.git \
            android/app/src/main/cpp/love
          git -C android/app/src/main/cpp/love checkout ef388d4371f5932491fbdcdd65ac7240e11c31a8
          git clone https://github.com/love2d/megasource.git \
            android/app/src/main/cpp/megasource
          git -C android/app/src/main/cpp/megasource checkout 14937cda16712142223af85301d261153a35719b

      # Mirrors love2d/love-android's own CI: CMake >= 3.25 from Kitware and
      # ninja, because the NDK-bundled CMake is too old for megasource.
      - name: Prepare build environment
        run: |
          sudo apt-get update
          curl -Lo kitware-archive.sh https://apt.kitware.com/kitware-archive.sh
          sudo bash ./kitware-archive.sh
          sudo apt-get install -y ninja-build cmake

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: adopt-hotspot
          java-version: 17
          cache: gradle

      # game.love is built from the repo source on every run instead of being
      # committed, so the APK can never ship stale Lua code.
      # Only drop what the runtime never reads: the Android shell itself, git
      # metadata, CI config and the headless test/docs/tooling trees.
      # NOTE: diy/ must stay - src/compat/loader.lua loads it as community
      # expansions.
      - name: Package game.love
        run: |
          set -euo pipefail
          rm -f android/app/src/embed/assets/game.love
          zip -r -q -X android/app/src/embed/assets/game.love . \
            -x 'android/*' '.git/*' '.github/*' 'tests/*' 'docs/*' 'tools/*' '*.swp'
          ls -lh android/app/src/embed/assets/game.love
          echo "--- sanity check ---"
          unzip -l android/app/src/embed/assets/game.love \
            | grep -E 'transport_android\.lua|ai_transport\.lua|main\.lua|diy/'

      - name: Report Android SDK
        run: |
          SDK_ROOT="${ANDROID_SDK_ROOT:-$ANDROID_HOME}"
          echo "SDK_ROOT=$SDK_ROOT"
          ls "$SDK_ROOT/platforms" 2>/dev/null || echo "(no platforms yet)"
          ls "$SDK_ROOT/ndk" 2>/dev/null || echo "(no ndk yet)"

      - name: Build embedded debug APK
        working-directory: android
        run: |
          chmod +x gradlew
          ./gradlew assembleEmbedRecordDebug --stacktrace

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: sgs-android-debug
          path: android/app/build/outputs/apk/embedRecord/debug/*.apk
          if-no-files-found: error
